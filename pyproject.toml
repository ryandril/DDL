[project]
name = "ddl"
version = "0.3.0"
description = "Extract assignment deadlines buried in Canvas announcements, sync them to Google Calendar, and get a daily digest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["canvas", "lms", "deadlines", "calendar", "students", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "icalendar>=5.0",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
